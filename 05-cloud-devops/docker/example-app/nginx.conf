# nginx as a reverse proxy / load balancer in front of the "app" service.
# Docker's internal DNS resolves "app" to every replica's IP.
upstream app_servers {
    server app:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
