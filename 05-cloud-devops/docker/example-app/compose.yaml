# Run two copies of the app behind an nginx load balancer.
#   docker compose up -d --build
#   for i in 1 2 3 4; do curl -s localhost:8080; echo; done   # hostname alternates between replicas
#   docker compose down
services:
  app:
    build: .
    image: example-app:1.0
    environment:
      GREETING: "Hello from Docker Compose!"
      APP_VERSION: "1.0.0"
    deploy:
      replicas: 2
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
