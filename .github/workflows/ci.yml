# CI for this learning repo: every push and pull request is checked automatically.
# Read the explanation in 05-cloud-devops/cicd/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts and code
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: ShellCheck the Bash scripts
        run: shellcheck 02-linux/scripts/*.sh

      - name: Check Python syntax
        run: python3 -m py_compile $(git ls-files '*.py')

      - name: Check JavaScript syntax
        run: |
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done

  test:
    name: Smoke-test the tools
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run the log analyzer on the sample log
        run: python3 04-programming/python/log_analyzer.py 04-programming/python/sample-access.log

      - name: Run the subnet calculator
        run: python3 03-networking/labs/subnet_calculator.py 10.0.0.0/16 --split 24 --contains 10.0.5.20

      - name: Run the system health script
        run: bash 02-linux/scripts/system-health.sh 99

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: 05-cloud-devops/terraform/aws-vpc
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (no AWS credentials needed)
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    name: Build and test the Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t example-app:ci 05-cloud-devops/docker/example-app

      - name: Run the container and call its health endpoint
        run: |
          docker run -d --name app -p 8080:8080 example-app:ci
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:8080/health; then
              echo; echo "Container is healthy"; exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
