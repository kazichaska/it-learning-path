# EXAMPLE workflow (not active here). To use it, copy it into .github/workflows/.
#
# Builds the example app's Docker image for amd64 + arm64 and pushes it to
# GitHub Container Registry (ghcr.io) when you push a version tag like v1.2.0.
#   git tag v1.0.0 && git push origin v1.0.0
name: Build and push image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write # needed to push to ghcr.io with the built-in GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/example-app

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx let one runner build images for several CPU architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically; no secret to create

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: 05-cloud-devops/docker/example-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
