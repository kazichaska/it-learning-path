# How often Prometheus collects ("scrapes") metrics, and from where.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"] # Docker Compose service name resolves via internal DNS
